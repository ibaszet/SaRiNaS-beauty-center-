<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarinas Beauty Center — Gestion des réservations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#F6F1E7;
  --ivory-deep:#EFE7D6;
  --black:#171310;
  --charcoal:#2B2620;
  --gold:#AD8A54;
  --gold-soft:#C7A876;
  --line: rgba(23,19,16,.12);
  --white:#FFFFFF;
  --green:#3E7D5A;
  --green-bg:#E7F1EB;
  --blue:#3A5C82;
  --blue-bg:#E7EEF5;
  --red:#B3452F;
  --red-bg:#F7E9E4;
  --gray:#7A7264;
  --gray-bg:#EFEBE2;
  --shadow:0 12px 40px rgba(23,19,16,.10);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Inter',sans-serif;background:var(--ivory);color:var(--charcoal);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'Playfair Display',serif;color:var(--black);}
button{font-family:'Inter',sans-serif;cursor:pointer;}
input,select,textarea{font-family:'Inter',sans-serif;}
a{color:inherit;}

/* ============ LOGIN ============ */
.login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--black);padding:20px;
}
.login-box{
  background:var(--ivory);width:100%;max-width:380px;padding:48px 38px;
  box-shadow:0 30px 80px rgba(0,0,0,.4);text-align:center;border-radius:2px;
}
.login-box.shake{animation:shake .5s;}
@keyframes shake{
  10%,90%{transform:translateX(-2px);}
  20%,80%{transform:translateX(4px);}
  30%,50%,70%{transform:translateX(-8px);}
  40%,60%{transform:translateX(8px);}
}
.login-logo{font-family:'Playfair Display',serif;font-style:italic;font-size:30px;margin-bottom:6px;}
.login-logo span{color:var(--gold);}
.login-sub{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--gray);margin-bottom:34px;}
.login-box input{
  width:100%;padding:15px 16px;border:1px solid var(--line);background:var(--white);
  font-size:15px;margin-bottom:14px;text-align:center;letter-spacing:.05em;border-radius:1px;
}
.login-box input:focus{outline:none;border-color:var(--gold);}
.login-btn{
  width:100%;padding:15px;background:var(--black);color:var(--white);border:none;
  font-size:13px;text-transform:uppercase;letter-spacing:.14em;font-weight:600;transition:.3s;
}
.login-btn:hover{background:var(--gold);}
.login-error{color:var(--red);font-size:12.5px;margin-top:12px;display:none;}
.login-error.show{display:block;}

/* ============ APP SHELL ============ */
.app{display:none;min-height:100vh;}
.app.show{display:block;}

.topbar{
  position:sticky;top:0;z-index:100;background:var(--black);color:var(--white);
  padding:16px 26px;display:flex;align-items:center;justify-content:space-between;
}
.topbar-logo{font-family:'Playfair Display',serif;font-style:italic;font-size:19px;}
.topbar-logo span{color:var(--gold-soft);}
.topbar-right{display:flex;align-items:center;gap:16px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:#4CAF7D;box-shadow:0 0 0 rgba(76,175,125,.5);animation:pulse 2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(76,175,125,.5);}70%{box-shadow:0 0 0 8px rgba(76,175,125,0);}100%{box-shadow:0 0 0 0 rgba(76,175,125,0);}}
.live-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.6);}
.logout-btn{
  background:none;border:1px solid rgba(255,255,255,.25);color:var(--white);
  padding:8px 16px;font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;border-radius:20px;transition:.3s;
}
.logout-btn:hover{background:rgba(255,255,255,.1);}

.tabs{
  display:flex;background:var(--white);border-bottom:1px solid var(--line);
  padding:0 26px;position:sticky;top:57px;z-index:99;overflow-x:auto;
}
.tab-btn{
  background:none;border:none;padding:18px 22px;font-size:13px;font-weight:600;
  color:var(--gray);border-bottom:2px solid transparent;transition:.25s;white-space:nowrap;
  display:flex;align-items:center;gap:8px;
}
.tab-btn.active{color:var(--black);border-bottom-color:var(--gold);}
.tab-count{
  background:var(--gold);color:var(--white);font-size:10.5px;font-weight:700;
  padding:1px 7px;border-radius:10px;min-width:18px;text-align:center;
}
.tab-btn:not(.active) .tab-count{background:var(--gray-bg);color:var(--gray);}

.main{max-width:1180px;margin:0 auto;padding:32px 22px 80px;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ============ DASHBOARD ============ */
.dash-cols{display:grid;grid-template-columns:1fr 1fr;gap:26px;}
.dash-col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.dash-col-head h2{font-size:19px;font-style:italic;}
.dash-col-head .count-pill{
  background:var(--gray-bg);color:var(--charcoal);font-size:12px;font-weight:700;
  padding:3px 11px;border-radius:14px;
}
.col-new .count-pill{background:#F7E9E4;color:var(--red);}
.col-confirmed .count-pill{background:var(--green-bg);color:var(--green);}
.empty-state{
  background:var(--white);border:1px dashed var(--line);padding:40px 20px;text-align:center;
  color:var(--gray);font-size:13.5px;border-radius:3px;
}
@media (max-width:820px){.dash-cols{grid-template-columns:1fr;}}

/* ============ BOOKING CARD ============ */
.booking-card{
  background:var(--white);border:1px solid var(--line);border-radius:3px;padding:20px 22px;
  margin-bottom:14px;box-shadow:var(--shadow);
}
.bc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;}
.bc-name{font-size:16.5px;font-weight:600;color:var(--black);}
.bc-service{font-size:13px;color:var(--gray);margin-top:2px;}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.badge{
  font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;
  padding:4px 9px;border-radius:12px;white-space:nowrap;
}
.badge-new{background:#F7E9E4;color:var(--red);}
.badge-confirmed{background:var(--green-bg);color:var(--green);}
.badge-done{background:var(--blue-bg);color:var(--blue);}
.badge-cancelled{background:var(--gray-bg);color:var(--gray);}
.badge-web{background:#EFE4F5;color:#6B4B8A;}
.badge-manual{background:var(--gray-bg);color:var(--gray);}

.bc-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 20px;margin-bottom:14px;padding:12px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);}
.bc-meta-item{font-size:12.5px;color:var(--gray);}
.bc-meta-item b{display:block;color:var(--charcoal);font-size:13.5px;font-weight:500;margin-top:2px;}
.bc-meta-item a{color:var(--charcoal);}
.bc-meta-item a:hover{color:var(--gold);}
.bc-note{font-size:12.5px;color:var(--gray);background:var(--ivory-deep);padding:10px 12px;border-radius:2px;margin-bottom:14px;}

.bc-actions{display:flex;flex-wrap:wrap;gap:8px;}
.bc-btn{
  border:none;padding:9px 14px;font-size:11.5px;font-weight:600;border-radius:20px;
  display:flex;align-items:center;gap:6px;transition:.25s;text-transform:uppercase;letter-spacing:.03em;
}
.bc-btn svg{width:13px;height:13px;}
.bc-btn-confirm{background:var(--green-bg);color:var(--green);}
.bc-btn-confirm:hover{background:var(--green);color:#fff;}
.bc-btn-done{background:var(--blue-bg);color:var(--blue);}
.bc-btn-done:hover{background:var(--blue);color:#fff;}
.bc-btn-cancel{background:var(--red-bg);color:var(--red);}
.bc-btn-cancel:hover{background:var(--red);color:#fff;}
.bc-btn-call{background:var(--gray-bg);color:var(--charcoal);}
.bc-btn-call:hover{background:var(--black);color:#fff;}
.bc-btn-wa{background:#E5F5EC;color:#1F8A4C;}
.bc-btn-wa:hover{background:#1F8A4C;color:#fff;}
.bc-btn-delete{background:var(--white);color:var(--red);border:1px solid var(--red-bg);margin-left:auto;}
.bc-btn-delete:hover{background:var(--red);color:#fff;}

/* ============ TOUTES TAB ============ */
.toolbar{display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap;}
.search-input{
  flex:1;min-width:220px;padding:12px 16px;border:1px solid var(--line);background:var(--white);
  font-size:14px;border-radius:2px;
}
.search-input:focus{outline:none;border-color:var(--gold);}
.filter-select{
  padding:12px 16px;border:1px solid var(--line);background:var(--white);font-size:14px;border-radius:2px;
}
.results-count{font-size:12.5px;color:var(--gray);margin-bottom:14px;}

/* ============ AJOUTER TAB ============ */
.add-form{background:var(--white);border:1px solid var(--line);padding:34px;max-width:560px;box-shadow:var(--shadow);border-radius:3px;}
.field{margin-bottom:20px;}
.field label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--gray);margin-bottom:8px;}
.field input,.field select,.field textarea{
  width:100%;padding:13px 15px;border:1px solid var(--line);background:var(--ivory);
  font-size:14.5px;border-radius:1px;
}
.field textarea{resize:vertical;min-height:80px;font-family:'Inter',sans-serif;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);background:var(--white);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.add-submit{
  width:100%;padding:15px;background:var(--black);color:var(--white);border:none;
  font-size:13px;text-transform:uppercase;letter-spacing:.14em;font-weight:600;transition:.3s;
}
.add-submit:hover{background:var(--gold);}
.add-success{
  display:none;background:var(--green-bg);color:var(--green);padding:12px 16px;font-size:13px;
  border-radius:2px;margin-bottom:18px;
}
.add-success.show{display:block;}

@media (max-width:560px){.field-row{grid-template-columns:1fr;}.add-form{padding:24px 20px;}}

.loading-state{text-align:center;padding:60px 20px;color:var(--gray);font-size:13.5px;}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="login-screen" id="loginScreen">
  <div class="login-box" id="loginBox">
    <div class="login-logo">Sarina<span>s</span></div>
    <div class="login-sub">Espace de gestion</div>
    <input type="password" id="passwordInput" placeholder="Mot de passe" autocomplete="current-password">
    <button class="login-btn" id="loginBtn">Se connecter</button>
    <div class="login-error" id="loginError">Mot de passe incorrect. Merci de réessayer.</div>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="app" id="app">

  <div class="topbar">
    <div class="topbar-logo">Sarina<span>s</span> — Gestion</div>
    <div class="topbar-right">
      <span class="live-dot"></span><span class="live-label">Synchronisé en direct</span>
      <button class="logout-btn" id="logoutBtn">Déconnexion</button>
    </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="dashboard">Tableau de bord <span class="tab-count" id="countDash">0</span></button>

    <div class="tab-panel" id="tab-add">

            <option>Head spa / Traitements capillaires</option>
            <option>Esthétique / Massage visage</option>
            <option>Beauté du regard</option>

            <option>Beauté des pieds</option>
            <option>Épilation</option>
            <option>Soins corps</option>
            <option>Mariage</option>
            <option>Services Premium</option>

          <div class="field">
            <label for="add-date">Date *</label>

<!-- ============ FIREBASE ============ -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDWB3wXOYjjF3jzY3AI-fkC-9lMZ23F9DM",
  authDomain: "sarinas-beauty-center.firebaseapp.com",
  databaseURL: "https://sarinas-beauty-center-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sarinas-beauty-center",
  storageBucket: "sarinas-beauty-center.firebasestorage.app",
  messagingSenderId: "1087402187728",
  appId: "1:1087402187728:web:4dfcaa44760ff9c30077d5"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const PROJECT_ROOT = "sarinas-beauty-center";
const WHATSAPP_NUMBER = "213550868719";
const ADMIN_PASSWORD = "Sarinas2026"; // À modifier avant mise en production
</script>

<script>
/* ============ LOGIN ============ */
const loginScreen = document.getElementById('loginScreen');
const loginBox = document.getElementById('loginBox');
const passwordInput = document.getElementById('passwordInput');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const app = document.getElementById('app');

function attemptLogin(){
  const val = passwordInput.value;
  if (val === ADMIN_PASSWORD){
    sessionStorage.setItem('sarinas_admin_auth', 'true');
    showApp();
  } else {
    loginError.classList.add('show');
    loginBox.classList.remove('shake');
    void loginBox.offsetWidth;
    loginBox.classList.add('shake');
    passwordInput.value='';
    passwordInput.focus();
  }
}
loginBtn.addEventListener('click', attemptLogin);
passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });

function showApp(){
  loginScreen.style.display='none';
  app.classList.add('show');
  initListeners();
}

if (sessionStorage.getItem('sarinas_admin_auth') === 'true'){
  showApp();
}

document.getElementById('logoutBtn').addEventListener('click', () => {
  sessionStorage.removeItem('sarinas_admin_auth');
  location.reload();
});

/* ============ TABS ============ */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

/* ============ DATA STATE ============ */
let bookings = {}; // id -> booking object
let listenersInitialized = false;

function initListeners(){
  if (listenersInitialized) return;
  listenersInitialized = true;

  const ref = db.ref(`${PROJECT_ROOT}/bookings`);

  ref.on('value', (snapshot) => {
    bookings = snapshot.val() || {};
    renderAll();
  }, (err) => {
    console.error('Erreur de synchronisation Firebase:', err);
  });
}

/* ============ HELPERS ============ */
function statusLabel(status){
  return {new:'Nouvelle', confirmed:'Confirmée', done:'Terminée', cancelled:'Annulée'}[status] || 'Nouvelle';
}
function statusBadgeClass(status){
  return {new:'badge-new', confirmed:'badge-confirmed', done:'badge-done', cancelled:'badge-cancelled'}[status] || 'badge-new';
}
function formatDate(dateStr){
  if (!dateStr) return '—';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'short', year:'numeric' });
}
function formatCreatedAt(ts){
  if (!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'short' }) + ' à ' + d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
}
function normalizePhoneForWa(rawPhone){
  let digits = (rawPhone || '').replace(/[^0-9]/g, '');
  if (!digits) return '';

  // Format international écrit "00213..." -> "213..."
  if (digits.startsWith('00')) {
    digits = digits.slice(2);
  }

  // Numéro algérien local sans indicatif : 0 + 9 chiffres (ex: 0674568704)
  // -> on remplace le 0 initial par l'indicatif pays 213
  const isLocalAlgerian = digits.length === 10 && digits[0] === '0' && ['5','6','7'].includes(digits[1]);
  if (isLocalAlgerian) {
    digits = '213' + digits.slice(1);
  }

  return digits;
}

function waLink(booking){
  const msg = `Bonjour ${booking.name}, ici Sarinas Beauty Center. Nous confirmons votre rendez-vous pour ${booking.service} le ${booking.date} à ${booking.time}.`;
  return `https://wa.me/${normalizePhoneForWa(booking.phone)}?text=${encodeURIComponent(msg)}`;
}

function bookingCardHTML(id, b){
  const status = b.status || 'new';
  const source = b.source === 'manual' ? 'Manuel' : 'Web';
  const sourceBadge = b.source === 'manual' ? 'badge-manual' : 'badge-web';

  return `
  <div class="booking-card" data-id="${id}">
    <div class="bc-top">
      <div>
        <div class="bc-name">${escapeHTML(b.name || 'Sans nom')}</div>
        <div class="bc-service">${escapeHTML(b.service || '—')}</div>
      </div>
      <div class="badges">
        <span class="badge ${statusBadgeClass(status)}">${statusLabel(status)}</span>
        <span class="badge ${sourceBadge}">${source}</span>
      </div>
    </div>
    <div class="bc-meta">
      <div class="bc-meta-item">Téléphone<b><a href="tel:${escapeHTML(b.phone||'')}">${escapeHTML(b.phone || '—')}</a></b></div>
      <div class="bc-meta-item">Date du RDV<b>${formatDate(b.date)} ${b.time ? 'à ' + b.time : ''}</b></div>
      <div class="bc-meta-item">Reçue le<b>${formatCreatedAt(b.createdAt)}</b></div>
      <div class="bc-meta-item">ID<b style="font-family:monospace;font-size:11px;">${id.slice(-8)}</b></div>
    </div>
    ${b.note ? `<div class="bc-note">${escapeHTML(b.note)}</div>` : ''}
    <div class="bc-actions">
      ${status !== 'confirmed' ? `<button class="bc-btn bc-btn-confirm" onclick="updateStatus('${id}','confirmed')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>Confirmer</button>` : ''}
      ${status !== 'done' ? `<button class="bc-btn bc-btn-done" onclick="updateStatus('${id}','done')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>Terminé</button>` : ''}
      ${status !== 'cancelled' ? `<button class="bc-btn bc-btn-cancel" onclick="updateStatus('${id}','cancelled')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>Annuler</button>` : ''}
      <a class="bc-btn bc-btn-call" href="tel:${escapeHTML(b.phone||'')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.362 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>Appeler</a>
      <a class="bc-btn bc-btn-wa" href="${waLink(b)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.39 1.26 4.81L2 22l5.42-1.42a9.87 9.87 0 004.62 1.18h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2z"/></svg>WhatsApp</a>
      <button class="bc-btn bc-btn-delete" onclick="deleteBooking('${id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>Supprimer</button>
    </div>
  </div>`;
}

function escapeHTML(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ============ ACTIONS ============ */
function updateStatus(id, status){
  db.ref(`${PROJECT_ROOT}/bookings/${id}`).update({ status }).catch(err => {
    alert('Erreur lors de la mise à jour du statut.');
    console.error(err);
  });
}
function deleteBooking(id){
  if (!confirm('Supprimer définitivement cette réservation ?')) return;
  db.ref(`${PROJECT_ROOT}/bookings/${id}`).remove().catch(err => {
    alert('Erreur lors de la suppression.');
    console.error(err);
  });
}
window.updateStatus = updateStatus;
window.deleteBooking = deleteBooking;

/* ============ RENDER ============ */
function renderAll(){
  const entries = Object.entries(bookings);
  entries.sort((a,b) => (b[1].createdAt||0) - (a[1].createdAt||0));

  // Dashboard
  const newList = entries.filter(([,b]) => (b.status||'new') === 'new');
  const confirmedList = entries.filter(([,b]) => b.status === 'confirmed');

  document.getElementById('listNew').innerHTML = newList.length
    ? newList.map(([id,b]) => bookingCardHTML(id,b)).join('')
    : '<div class="empty-state">Aucune nouvelle réservation pour le moment.</div>';

  document.getElementById('listConfirmed').innerHTML = confirmedList.length
    ? confirmedList.map(([id,b]) => bookingCardHTML(id,b)).join('')
    : '<div class="empty-state">Aucune réservation confirmée pour le moment.</div>';

  document.getElementById('countNew').textContent = newList.length;
  document.getElementById('countConfirmed').textContent = confirmedList.length;
  document.getElementById('countDash').textContent = newList.length;
  document.getElementById('countAll').textContent = entries.length;

  renderAllTab();
}

function renderAllTab(){
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const statusVal = document.getElementById('statusFilter').value;

  let entries = Object.entries(bookings);
  entries.sort((a,b) => (b[1].createdAt||0) - (a[1].createdAt||0));

  if (search){
    entries = entries.filter(([,b]) =>
      (b.name||'').toLowerCase().includes(search) ||
      (b.phone||'').toLowerCase().includes(search)
    );
  }
  if (statusVal !== 'all'){
    entries = entries.filter(([,b]) => (b.status||'new') === statusVal);
  }

  document.getElementById('resultsCount').textContent = `${entries.length} réservation${entries.length !== 1 ? 's' : ''} trouvée${entries.length !== 1 ? 's' : ''}`;
  document.getElementById('listAll').innerHTML = entries.length
    ? entries.map(([id,b]) => bookingCardHTML(id,b)).join('')
    : '<div class="empty-state">Aucune réservation ne correspond à votre recherche.</div>';
}

document.getElementById('searchInput').addEventListener('input', renderAllTab);
document.getElementById('statusFilter').addEventListener('change', renderAllTab);

/* ============ ADD FORM ============ */
const addForm = document.getElementById('addForm');
const addSuccess = document.getElementById('addSuccess');
document.getElementById('add-date').min = new Date().toISOString().split('T')[0];

addForm.addEventListener('submit', async function(e){
  e.preventDefault();

  const name = document.getElementById('add-name').value.trim();
  const phone = document.getElementById('add-phone').value.trim();
  const service = document.getElementById('add-service').value;
  const date = document.getElementById('add-date').value;
  const time = document.getElementById('add-time').value;
  const note = document.getElementById('add-note').value.trim();

  const bookingRef = db.ref(`${PROJECT_ROOT}/bookings`).push();
  const bookingData = {
    id: bookingRef.key,
    name, phone, service, date, time,
    appointment: `${date} ${time}`,
    note: note || null,
    status: 'new',
    source: 'manual',
    createdAt: firebase.database.ServerValue.TIMESTAMP
  };

  try {
    await bookingRef.set(bookingData);
    addSuccess.classList.add('show');
    addForm.reset();
    document.getElementById('add-date').min = new Date().toISOString().split('T')[0];
    setTimeout(() => addSuccess.classList.remove('show'), 3500);
  } catch (err) {
    alert("Erreur lors de l'ajout de la réservation.");
    console.error(err);
  }
});
</script>
</body>
</html>
